<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-label="Étudiant qui lit un livre">
  <defs>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#a08cff"/>
      <stop offset="1" stop-color="#6f56e0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f6c9a4"/>
      <stop offset="1" stop-color="#e0a479"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3a6b"/>
      <stop offset="1" stop-color="#1b2447"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3f5"/>
    </linearGradient>
  </defs>

  <!-- Hair (back) -->
  <ellipse cx="100" cy="56" rx="46" ry="42" fill="#1d1a2b"/>
  <!-- Ears -->
  <ellipse cx="58" cy="70" rx="8" ry="10" fill="url(#skin)"/>
  <ellipse cx="142" cy="70" rx="8" ry="10" fill="url(#skin)"/>
  <!-- Face -->
  <path d="M60 46 h80 v34 a40 40 0 0 1-80 0 Z" fill="url(#skin)"/>
  <ellipse cx="100" cy="80" rx="40" ry="34" fill="url(#skin)"/>
  <!-- Hair (front sweep) -->
  <path d="M56 60 C 60 22, 140 22, 144 60 C 132 44, 116 38, 100 42 C 82 46, 66 50, 56 60 Z" fill="#1d1a2b"/>
  <!-- Eyes -->
  <ellipse cx="84" cy="76" rx="7.5" ry="8.5" fill="#fff"/>
  <ellipse cx="116" cy="76" rx="7.5" ry="8.5" fill="#fff"/>
  <circle cx="85" cy="78" r="4.4" fill="#1d1a2b"/>
  <circle cx="117" cy="78" r="4.4" fill="#1d1a2b"/>
  <circle cx="86.6" cy="76" r="1.5" fill="#fff"/>
  <circle cx="118.6" cy="76" r="1.5" fill="#fff"/>
  <!-- Brows -->
  <path d="M75 64 q9-5 18-1" stroke="#1d1a2b" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M107 63 q9-4 18 1" stroke="#1d1a2b" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M90 96 q10 8 20 0" stroke="#b3714f" stroke-width="3.2" fill="none" stroke-linecap="round"/>

  <!-- Body / hoodie -->
  <path d="M56 210 v-38 a44 44 0 0 1 44-44 a44 44 0 0 1 44 44 v38 Z" fill="url(#hoodie)"/>
  <!-- Hood collar -->
  <path d="M68 138 q32 22 64 0 q-8 20-32 20 q-24 0-32-20 Z" fill="#5c46c4" opacity="0.55"/>
  <!-- Sleeves holding the book -->
  <path d="M44 200 q-4-38 22-52 l14 22 q-16 10-16 30 Z" fill="#8f79f2"/>
  <path d="M156 200 q4-38-22-52 l-14 22 q16 10 16 30 Z" fill="#8f79f2"/>

  <!-- Book -->
  <g transform="translate(100,186)">
    <path d="M-58 -20 h56 v42 h-56 Z" fill="url(#bookCover)"/>
    <path d="M2 -20 h56 v42 H2 Z" fill="url(#bookCover)"/>
    <path d="M-54 -16 q26 6 52 0 v34 q-26 6-52 0 Z" fill="url(#page)"/>
    <path d="M-2 -16 q26-6 52 0 v34 q-26-6-52 0 Z" fill="url(#page)"/>
    <path d="M-2 -16 v34" stroke="#c2c7e0" stroke-width="2"/>
    <g stroke="#b9bfd8" stroke-width="2.4" stroke-linecap="round">
      <path d="M-46 -6 h32"/><path d="M-46 2 h32"/><path d="M-46 10 h22"/>
      <path d="M8 -6 h32"/><path d="M8 2 h32"/><path d="M8 10 h22"/>
    </g>
  </g>
  <!-- Hands -->
  <ellipse cx="46" cy="196" rx="12" ry="10" fill="url(#skin)"/>
  <ellipse cx="154" cy="196" rx="12" ry="10" fill="url(#skin)"/>
</svg>
